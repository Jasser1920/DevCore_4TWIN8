services:

  postgres_app:
    image: postgres:16-alpine
    container_name: postgres_app
    environment:
      POSTGRES_USER: smartsite
      POSTGRES_PASSWORD: smartsite
      POSTGRES_DB: smartsite
    volumes:
      - pg_app_data:/var/lib/postgresql/data
    networks:
      - smartsite_net
    restart: unless-stopped

  mongo_app:
    image: mongo:7
    container_name: mongo_app
    volumes:
      - mongo_app_data:/data/db
    networks:
      - smartsite_net
    restart: unless-stopped

  postgres_keycloak:
    image: postgres:16-alpine
    container_name: postgres_keycloak
    environment:
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
      POSTGRES_DB: keycloak
    volumes:
      - pg_keycloak_data:/var/lib/postgresql/data
    networks:
      - smartsite_net
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: keycloak
    command: start-dev
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: postgres_keycloak
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8080:8080"
    depends_on:
      - postgres_keycloak
    networks:
      - smartsite_net
    restart: unless-stopped

  backend:
    build:
      context: ../smartsite-backend/smartsite-backend
    container_name: backend
    environment:
      PORT: 3000
      POSTGRES_HOST: postgres_app
      POSTGRES_PORT: 5432
      POSTGRES_USER: smartsite
      POSTGRES_PASSWORD: smartsite
      POSTGRES_DB: smartsite
      MONGODB_URI: mongodb://mongo_app:27017/smartsite
      KEYCLOAK_URL: http://keycloak:8080
      REALM: smartsite-realm
      CLIENT_ID: smartsite-backend
      CLIENT_SECRET: Rmc4EtpS3uaEzWx9Nq1TkzXQkuASeVc2
      KEYCLOAK_ADMIN_USERNAME: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      FRONTEND_URL: http://localhost:5173
      JWT_SECRET: your-super-secret-key-12345
      SMARTSITE_PROGRESS_AI_URL: http://prog_service:8001
      AI_API_URL: http://ai_service:8000
      GMAIL_USER: devcoresmartsite@gmail.com
      GMAIL_PASSWORD: fxbz waet lzri epmk
      RECAPTCHA_SECRET_KEY: 6LexbHosAAAAAMEqP0U86mikr9MtbL86TEPq6uAx
      SUPER_ADMIN_USERNAME: admin
      SUPER_ADMIN_EMAIL: admin@smartsite.com
      SUPER_ADMIN_PASSWORD: Admin@123
      DIRECTOR_USERNAME: director
      DIRECTOR_EMAIL: director@smartsite.com
      DIRECTOR_PASSWORD: Director@123
      PROJECT_MANAGER_USERNAME: project_manager
      PROJECT_MANAGER_EMAIL: pm@smartsite.com
      PROJECT_MANAGER_PASSWORD: ProjectManager@123
      QHSE_MANAGER_USERNAME: qhse_manager
      QHSE_MANAGER_EMAIL: qhse@smartsite.com
      QHSE_MANAGER_PASSWORD: QhseManager@123
      CLIENT_USERNAME: client
      CLIENT_EMAIL: client@smartsite.com
      CLIENT_PASSWORD: Client@123
    ports:
      - "3000:3000"
    depends_on:
      - postgres_app
      - mongo_app
      - keycloak
    networks:
      - smartsite_net
    restart: unless-stopped

  frontend:
    build:
      context: ../smartsite-frontend
    container_name: frontend
    environment:
      VITE_API_URL: http://localhost:3000
      VITE_RECAPTCHA_SITE_KEY: 6LexbHosAAAAAA-0o_m20RsayxJE-9Zs8r2OWGZ_
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - smartsite_net
    restart: unless-stopped

  ai_service:
    build:
      context: ../smartsite-ai
    container_name: ai_service
    environment:
      GEMINI_API_KEY: AIzaSyAliCCqbkzFe72VN7xRakgwXwwGPtEJcwQ
    ports:
      - "8000:8000"
    networks:
      - smartsite_net
    restart: unless-stopped

  prog_service:
    build:
      context: ../Smartsite-prog
    container_name: prog_service
    ports:
      - "8001:8001"
    networks:
      - smartsite_net
    restart: unless-stopped

volumes:
  pg_app_data:
  mongo_app_data:
  pg_keycloak_data:

networks:
  smartsite_net:
    driver: bridge
